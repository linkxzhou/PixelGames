<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>PixelGames</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas { width: min(100vw, calc(100vh * 1.153846)); height: auto; max-height: 100vh; image-rendering: pixelated; outline: none; }
    #pxl-audio-toggle { position: fixed; top: 8px; right: 8px; padding: 6px 10px; color: #eee; background: #222; border: 1px solid #777; font: 12px monospace; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="0"></canvas>
  <button id="pxl-audio-toggle" type="button">Enable sound</button>
  <script src="mq_js_bundle.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
