[package]
name = "battle-city-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Battle City: a macroquad window over a deterministic fixed-step simulation, loading the pxl asset package"

[lib]
name = "battle_city"
path = "src/lib.rs"

[[bin]]
name = "battle-city"
path = "src/main.rs"

[dependencies]
png = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
macroquad = { version = "=0.4.13", default-features = false, optional = true }

[features]
default = ["window"]
window = ["dep:macroquad"]
