[workspace]
resolver = "2"
members = [
    "libs/pxl-core",
    "libs/pxl-format",
    "libs/pxl-gen",
    "libs/pxl-ops",
    "libs/pxl-qa",
    "libs/pxl-export",
    "libs/pxl-art",
    "libs/pxl-svg",
    "libs/pxl-engine",
    "libs/pxl-wasm",
    "libs/pxl-audio",
    "libs/pxl-cli",
    "libs/pxl-ase-doc",
    "libs/pxl-ase-io",
    "libs/pxl-ase",
    "libs/pxl-arcade-kit",
    "libs/pxl-fight",
    # `games/` is NOT a member here on purpose: it is gitignored (only
    # games/battle-city is tracked), so any games member makes `cargo metadata`
    # fail on a clean clone and takes `cargo build -p pxl-cli` (and
    # scripts/build-pxl-asset-gen.sh) down with it. Game runtimes are their own
    # workspace, see games/Cargo.toml.
    "steps/step-100-design",
    "steps/step-200-art-spec",
    "steps/step-400-package",
    "steps/step-500-engine",
    "steps/step-500-engine/web-engine",
    "libs/pxl-agent",
    "libs/pxl-store",
    "libs/pxl-contract",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["preserve_order"] }
sha2 = { version = "0.10", default-features = false }
png = "0.17"
gif = "0.13"
clap = { version = ">=4.5.23, <4.6", features = ["derive"] }
pxl-core = { path = "libs/pxl-core" }
pxl-format = { path = "libs/pxl-format" }
pxl-gen = { path = "libs/pxl-gen" }
pxl-ops = { path = "libs/pxl-ops" }
pxl-art = { path = "libs/pxl-art" }
pxl-svg = { path = "libs/pxl-svg" }
pxl-qa = { path = "libs/pxl-qa" }
pxl-export = { path = "libs/pxl-export" }
pxl-engine = { path = "libs/pxl-engine" }
pxl-wasm = { path = "libs/pxl-wasm" }
pxl-audio = { path = "libs/pxl-audio" }
pxl-arcade-kit = { path = "libs/pxl-arcade-kit" }
pxl-contract = { path = "libs/pxl-contract" }
pxl-fight = { path = "libs/pxl-fight" }
pxl-store = { path = "libs/pxl-store" }
pxl-agent = { path = "libs/pxl-agent" }
pxl-ase-doc = { path = "libs/pxl-ase-doc" }
pxl-ase-io = { path = "libs/pxl-ase-io" }
pxl-ase = { path = "libs/pxl-ase" }
rhai = { version = "1.19", default-features = false, features = ["std"] }

# macroquad 0.4.13 pins miniquad =0.4.6. That release calls center() before the
# NSView exists; AppKit then messages a nil view and Apple Silicon panics.
# This path is 0.4.6 plus that init-order fix. See vendor/miniquad/src/native/macos.rs.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
