[package]
name = "pxl-arcade-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared pixel-arcade runtime: package loading, sheet frames, integer scaling, input, pixel HUD and deterministic replay"

[dependencies]
png = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
macroquad = { version = "=0.4.13", default-features = false, optional = true }

[features]
default = ["window"]
window = ["dep:macroquad"]
